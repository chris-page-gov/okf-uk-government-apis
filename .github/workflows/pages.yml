name: Deploy Pages

on:
  workflow_run:
    workflows: ["OKF bundle CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chris-page-gov/okf-explorer
          ref: cce6e68d95c2946bb425effbaab48fbf04281a09
          path: okf-explorer
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
      - name: Install the attested uv 0.13.4 bootstrap
        run: bash scripts/install_pinned_uv.sh
      - run: uv sync --locked
      - if: github.event_name == 'workflow_dispatch'
        run: uv run --locked python -m unittest discover -s tests -v
      - if: github.event_name == 'workflow_dispatch'
        run: uv run --locked python scripts/check_bundle.py
      - if: github.event_name == 'workflow_dispatch'
        run: uv run --locked python scripts/build_checksums.py --check
      - if: github.event_name == 'workflow_dispatch'
        run: uv run --locked python scripts/check_publication_contract.py
      - if: github.event_name == 'workflow_dispatch'
        run: uv run --locked python scripts/check_frozen_graph_identity.py
      - if: github.event_name == 'workflow_dispatch'
        run: uv run --project okf-explorer --locked python scripts/check_core_reader_parity.py --consumer-root okf-explorer
      - if: github.event_name == 'workflow_dispatch'
        run: uv run --project okf-explorer --locked python okf-explorer/scripts/reconcile_okf_repositories.py --repo . --strict
      - if: github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: pnpm
          cache-dependency-path: okf-explorer/apps/okf-explorer/pnpm-lock.yaml
      - if: github.event_name == 'workflow_dispatch'
        name: Install pinned Explorer Reader dependencies
        run: pnpm --dir okf-explorer/apps/okf-explorer install --frozen-lockfile
      - if: github.event_name == 'workflow_dispatch'
        name: Install canonical Chromium
        run: timeout 5m pnpm --dir okf-explorer/apps/okf-explorer exec playwright install chromium
      - if: github.event_name == 'workflow_dispatch'
        name: Replay core descriptor journeys
        run: >-
          pnpm --dir okf-explorer/apps/okf-explorer acceptance:bundle --
          --bundle-root bundle --journeys bundle/core-reader-journeys.json
          --output "$RUNNER_TEMP/core-reader.json" --port 4282
      - if: github.event_name == 'workflow_dispatch'
        name: Replay metadata descriptor journeys
        run: >-
          pnpm --dir okf-explorer/apps/okf-explorer acceptance:bundle --
          --bundle-root bundle --journeys bundle/notification-reader-journeys.json
          --output "$RUNNER_TEMP/metadata-reader.json" --port 4283
      - if: github.event_name == 'workflow_dispatch'
        name: Click both walkthrough links at desktop and mobile sizes
        run: timeout 15m node scripts/verify_walkthrough_browser.mjs "$RUNNER_TEMP/api-walkthrough-browser.json"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: bundle
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Verify deployed routes and identity
        env:
          OKF_DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: uv run --locked python scripts/verify_deployment.py
