name: OKF bundle CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chris-page-gov/okf-explorer
          ref: cce6e68d95c2946bb425effbaab48fbf04281a09
          path: okf-explorer
          persist-credentials: false
      - name: Install the attested uv 0.13.4 bootstrap
        run: bash scripts/install_pinned_uv.sh
      - name: Install governed CPython 3.12.11 with uv
        run: uv python install 3.12.11
      - name: Sync the locked Python environment
        run: uv sync --locked --python 3.12.11
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python scripts/check_bundle.py
      - run: uv run --locked python scripts/build_checksums.py --check
      - run: uv run --locked python scripts/check_publication_contract.py
      - name: Verify frozen relationship identity
        run: uv run --locked python scripts/check_frozen_graph_identity.py
      - run: uv run --project okf-explorer --locked python okf-explorer/scripts/reconcile_okf_repositories.py --repo . --strict
      - name: Check complete core against the pinned Explorer Reader
        run: uv run --project okf-explorer --locked python scripts/check_core_reader_parity.py --consumer-root okf-explorer
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: pnpm
          cache-dependency-path: okf-explorer/apps/okf-explorer/pnpm-lock.yaml
      - name: Install the pinned Explorer Reader dependencies
        run: pnpm --dir okf-explorer/apps/okf-explorer install --frozen-lockfile
      - name: Install the canonical Chromium browser
        run: timeout 5m pnpm --dir okf-explorer/apps/okf-explorer exec playwright install chromium
      - name: Replay the core descriptor journeys
        run: >-
          pnpm --dir okf-explorer/apps/okf-explorer acceptance:bundle --
          --bundle-root "$PWD/bundle" --journeys "$PWD/bundle/core-reader-journeys.json"
          --output "$RUNNER_TEMP/core-reader.json" --port 4282
      - name: Replay the metadata descriptor journeys
        run: >-
          pnpm --dir okf-explorer/apps/okf-explorer acceptance:bundle --
          --bundle-root "$PWD/bundle" --journeys "$PWD/bundle/notification-reader-journeys.json"
          --output "$RUNNER_TEMP/metadata-reader.json" --port 4283
      - name: Click both walkthrough links at desktop and mobile sizes
        run: timeout 15m node scripts/verify_walkthrough_browser.mjs "$RUNNER_TEMP/api-walkthrough-browser.json"
      - name: Retain exact Reader acceptance receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-reader-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/core-reader.json
            ${{ runner.temp }}/metadata-reader.json
            ${{ runner.temp }}/api-walkthrough-browser.json
            ${{ runner.temp }}/api-walkthrough-browser-*.png
          if-no-files-found: warn
          retention-days: 7
